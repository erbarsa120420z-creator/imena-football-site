services:
  - type: web
    name: imena-football-site
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /
    disk:
      name: imena-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: IMENA_DATA_DIR
        value: /opt/render/project/src/data
